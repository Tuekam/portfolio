<!-- _includes/header.html -->
<nav class="sticky top-0 z-50 border-b border-[var(--border-color,#E4E1D8)] transition-all duration-300"
     style="background:rgba(247,245,241,0.88); backdrop-filter:blur(10px);"
     id="mainNav">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between">

    <!-- Logo -->
    <a href="{{ '/' | relative_url }}" class="font-heading font-bold text-base sm:text-lg flex items-center gap-2 flex-shrink-0">
      <span class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-sm bg-[var(--indigo,#4F46E5)] rotate-12 inline-block"></span>
      <span id="authorName">{{ site.author | default: "votrenom" }}</span>
      <span class="mono text-[var(--indigo-deep,#3730A3)]">.dev</span>
    </a>

    <!-- Navigation Desktop -->
    <ul class="nav-links-desktop">
      <li><a href="#about">À propos</a></li>
      <li><a href="#projects">Projets</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <!-- Actions -->
    <div class="header-actions">
      <!-- Dark Mode -->
      <button id="darkToggle" aria-label="Basculer le mode sombre" class="dark-toggle-btn">
        <i class="fas fa-moon"></i>
      </button>

      <!-- WhatsApp CTA (desktop) -->
      <a href="https://wa.me/{{ site.whatsapp | default: '33612345678' }}?text=Bonjour%2C%20je%20viens%20de%20voir%20votre%20portfolio%20et%20je%20souhaite%20vous%20contacter."
         target="_blank" rel="noopener"
         class="whatsapp-desktop">
        <i class="fab fa-whatsapp"></i> Me contacter
      </a>

      <!-- WhatsApp CTA (mobile - icône) -->
      <a href="https://wa.me/{{ site.whatsapp | default: '33612345678' }}?text=Bonjour%2C%20je%20viens%20de%20voir%20votre%20portfolio%20et%20je%20souhaite%20vous%20contacter."
         target="_blank" rel="noopener"
         class="whatsapp-mobile"
         aria-label="Me contacter sur WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>

      <!-- Menu Hamburger -->
      <button id="menuToggle" class="menu-hamburger" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </div>

  <!-- Menu Mobile - Version horizontale avec police réduite -->
  <div id="mobileMenu" class="mobile-menu">
    <ul class="mobile-menu-list">
      <li><a href="#about">À propos</a></li>
      <li><a href="#projects">Projets</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<script>
  // Menu Hamburger
  document.getElementById('menuToggle').addEventListener('click', function() {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('active');
    const icon = this.querySelector('i');
    if (menu.classList.contains('active')) {
      icon.className = 'fas fa-times';
    } else {
      icon.className = 'fas fa-bars';
    }
  });
</script>

<style>
  /* ============================================================
     STYLES DU HEADER (CSS pur)
     ============================================================ */

  /* --- Navigation Desktop --- */
  .nav-links-desktop {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .nav-links-desktop li a {
    color: var(--text-secondary, #5A5870);
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links-desktop li a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--indigo, #4F46E5);
    transition: width 0.3s;
  }
  .nav-links-desktop li a:hover {
    color: var(--text-primary, #1C1B29);
  }
  .nav-links-desktop li a:hover::after {
    width: 100%;
  }

  /* --- Actions du header --- */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dark-toggle-btn {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text-secondary, #5A5870);
    transition: color 0.3s;
    padding: 4px 8px;
  }
  .dark-toggle-btn:hover {
    color: var(--text-primary, #1C1B29);
  }

  .whatsapp-desktop {
    background: var(--ink, #1C1B29);
    color: var(--paper, #F7F5F1);
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.3s, box-shadow 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .whatsapp-desktop:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow, 0 12px 30px -14px rgba(28,27,41,0.18));
  }

  .whatsapp-mobile {
    display: none;
    background: #25D366;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    text-decoration: none;
    transition: transform 0.3s;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
  }
  .whatsapp-mobile:hover {
    transform: scale(1.1);
  }

  .menu-hamburger {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-secondary, #5A5870);
    transition: color 0.3s;
    padding: 4px 8px;
  }
  .menu-hamburger:hover {
    color: var(--text-primary, #1C1B29);
  }

  /* --- Menu Mobile --- */
  .mobile-menu {
    display: none;
    background: var(--bg-card, #FFFFFF);
    border-top: 1px solid var(--border-color, #E4E1D8);
    padding: 10px 12px;
  }
  .mobile-menu.active {
    display: block;
  }

  .mobile-menu-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px 14px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .mobile-menu-list li a {
    display: block;
    padding: 6px 12px;
    border-radius: 8px;
    color: var(--text-secondary, #5A5870);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .mobile-menu-list li a:hover {
    color: var(--indigo, #4F46E5);
    background: var(--indigo-light, #EDEBFC);
  }

  /* ============================================================
     RESPONSIVE - MENU MOBILE SUR UNE LIGNE
     ============================================================ */

  /* Tablette et mobile (< 768px) */
  @media (max-width: 767px) {
    .nav-links-desktop {
      display: none !important;
    }

    .whatsapp-desktop {
      display: none !important;
    }

    .whatsapp-mobile {
      display: flex !important;
    }

    .menu-hamburger {
      display: block !important;
    }
  }

  /* Desktop (>= 768px) */
  @media (min-width: 768px) {
    .whatsapp-mobile {
      display: none !important;
    }

    .menu-hamburger {
      display: none !important;
    }

    .mobile-menu {
      display: none !important;
    }
  }

  /* ============================================================
     TRÈS PETIT MOBILE (< 400px) - RÉDUCTION POUR UNE LIGNE
     ============================================================ */
  @media (max-width: 400px) {
    .mobile-menu-list {
      gap: 4px 8px;
    }
    .mobile-menu-list li a {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    #authorName {
      font-size: 0.8rem;
    }
    .mono {
      font-size: 0.8rem;
    }
    .logo-dot {
      width: 8px;
      height: 8px;
    }
    .whatsapp-mobile {
      width: 34px;
      height: 34px;
      font-size: 1rem;
    }
    .menu-hamburger {
      font-size: 1.2rem;
    }
    .dark-toggle-btn {
      font-size: 1rem;
    }
  }

  /* ============================================================
     TRÈS TRÈS PETIT MOBILE (< 360px)
     ============================================================ */
  @media (max-width: 360px) {
    .mobile-menu-list {
      gap: 2px 6px;
    }
    .mobile-menu-list li a {
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 4px;
    }
    #authorName {
      font-size: 0.7rem;
    }
    .mono {
      font-size: 0.7rem;
    }
    .logo-dot {
      width: 6px;
      height: 6px;
    }
    .whatsapp-mobile {
      width: 30px;
      height: 30px;
      font-size: 0.85rem;
    }
    .menu-hamburger {
      font-size: 1rem;
    }
    .dark-toggle-btn {
      font-size: 0.85rem;
    }
  }

  /* ============================================================
     LE NOM EST TOUJOURS VISIBLE
     ============================================================ */
  #authorName {
    display: inline !important;
  }
</style>
